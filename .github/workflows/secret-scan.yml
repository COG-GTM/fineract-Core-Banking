name: Secret Scan and AWS Profile Checks

on: [push, pull_request]

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.24.3
  GITLEAKS_SHA256: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c

jobs:
  secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Self-test - scan must fail on planted secrets
        run: |
          planted=$(mktemp -d)
          cp .gitleaks.toml "$planted/"
          mkdir -p "$planted/config/docker/env"
          # Generated at runtime so no secret is ever committed
          echo "aws_access_key_id = AKIA$(tr -dc 'A-Z2-7' < /dev/urandom | head -c 16)" > "$planted/credentials"
          echo "FINERACT_HIKARI_PASSWORD=$(openssl rand -hex 20)" > "$planted/config/docker/env/planted.env"
          echo 'JAVA_TOOL_OPTIONS=-agentlib:jdwp=transport=dt_socket,server=y,address=*:5000' >> "$planted/config/docker/env/planted.env"
          set +e
          gitleaks dir "$planted" --no-banner --redact --config .gitleaks.toml --exit-code 1 --report-format json --report-path /tmp/planted.json
          status=$?
          set -e
          rules=$(jq -r '[.[].RuleID] | unique | join(",")' /tmp/planted.json)
          echo "exit=$status rules=$rules"
          for rule in aws-access-token fineract-env-literal-credential fineract-jdwp-agent; do
            [[ ",$rules," == *",$rule,"* ]] || { echo "::error::planted secret not detected by $rule"; exit 1; }
          done
          [[ $status -eq 1 ]] || { echo "::error::gitleaks did not fail on planted secrets"; exit 1; }

      - name: Scan the working tree
        run: gitleaks dir . --no-banner --redact --config .gitleaks.toml --exit-code 1

      - name: Scan the commits of this change
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -n "$BASE_SHA" && "$BASE_SHA" != 0000000000000000000000000000000000000000 ]] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            gitleaks git . --no-banner --redact --config .gitleaks.toml --exit-code 1 --log-opts="$BASE_SHA..HEAD"
          else
            echo "No base commit available; working tree scan above covers the current state."
          fi

  aws-profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Task definitions are up to date with config/aws
        run: python3 scripts/aws/render_task_definitions.py --check

      - name: AWS profile contract checks
        run: python3 scripts/aws/verify_aws_profile.py

      - name: Contract check self-test
        run: python3 scripts/aws/test_verify_aws_profile.py
