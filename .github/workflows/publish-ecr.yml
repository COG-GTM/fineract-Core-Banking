name: Fineract Publish to ECR
on:
    push:
        branches:
            - develop
        tags:
            - 1.*
permissions:
    contents: read
    id-token: write
jobs:
    build:
        runs-on: ubuntu-24.04
        timeout-minutes: 60
        env:
            DEVELOCITY_ACCESS_KEY: ${{ secrets.DEVELOCITY_ACCESS_KEY }}
            AWS_REGION: ${{ vars.AWS_REGION }}
            ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
            ARTEFACT_BUCKET: ${{ vars.ARTEFACT_BUCKET }}
            CODEPIPELINE_NAME: ${{ vars.CODEPIPELINE_NAME }}
        steps:
            - name: Checkout Source Code
              uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
              with:
                  fetch-depth: 0

            - name: Set up JDK 21
              uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e # v5
              with:
                  java-version: '21'
                  distribution: 'zulu'

            - name: Setup Gradle
              uses: gradle/actions/setup-gradle@f29f5a9d7b09a7c6b29859002d29d24e1674c884 # v5.0.1

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4
              with:
                  role-to-assume: ${{ secrets.AWS_ECR_PUBLISH_ROLE_ARN }}
                  aws-region: ${{ vars.AWS_REGION }}

            - name: Login to Amazon ECR
              id: ecr_login
              uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2

            - name: Get Git Hashes
              run: |
                  echo "short_hash=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
                  echo "long_hash=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
              id: git_hashes

            - name: Build and push the Apache Fineract image to ECR
              env:
                  REGISTRY: ${{ steps.ecr_login.outputs.registry }}
              run: |
                  TAGS=${{ github.ref_name }}
                  if [ "${{ github.ref_name }}" == "develop" ]; then
                    TAGS="$TAGS,${{ steps.git_hashes.outputs.short_hash }},${{ steps.git_hashes.outputs.long_hash }}"
                  fi
                  # Immutable, never-reused tags. The ECR repository has tag immutability
                  # enabled, so re-running a build for the same commit fails fast instead of
                  # silently moving a tag to different content.
                  TAGS="$TAGS,git-${{ steps.git_hashes.outputs.long_hash }},build-${{ github.run_id }}-${{ github.run_attempt }}"
                  ./gradlew --no-daemon --console=plain :fineract-provider:jib -x test -x cucumber \
                    -Djib.from.platforms=linux/amd64,linux/arm64 \
                    -Djib.to.image=$REGISTRY/$ECR_REPOSITORY \
                    -Djib.to.tags=$TAGS
                  echo "tags=$TAGS" >> $GITHUB_OUTPUT
                  echo "digest=$(cat fineract-provider/build/jib-image.digest)" >> $GITHUB_OUTPUT
                  echo "image=$REGISTRY/$ECR_REPOSITORY@$(cat fineract-provider/build/jib-image.digest)" >> $GITHUB_OUTPUT
              id: image

            - name: Generate CycloneDX SBOM
              run: ./gradlew --no-daemon --console=plain cyclonedxBom

            - name: Build artefact record
              id: artefact
              run: |
                  ./deploy/scripts/artefact-record.sh \
                    --image "${{ steps.image.outputs.image }}" \
                    --digest "${{ steps.image.outputs.digest }}" \
                    --tags "${{ steps.image.outputs.tags }}" \
                    --commit "${{ steps.git_hashes.outputs.long_hash }}" \
                    --ref "${{ github.ref_name }}" \
                    --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                    --sbom build/reports/bom.json \
                    --out build/artefact-record.json

            - name: Upload artefact record and SBOM
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: fineract-artefact-record
                  path: |
                      build/artefact-record.json
                      build/reports/bom.json
                      build/reports/bom.xml
                  if-no-files-found: error

            - name: Publish artefact record and SBOM to S3
              run: |
                  DIGEST="${{ steps.image.outputs.digest }}"
                  PREFIX="s3://$ARTEFACT_BUCKET/fineract/${DIGEST/:/-}"
                  aws s3 cp build/artefact-record.json "$PREFIX/artefact-record.json"
                  aws s3 cp build/reports/bom.json "$PREFIX/sbom.cyclonedx.json"
                  aws s3 cp build/reports/bom.xml "$PREFIX/sbom.cyclonedx.xml"
                  # Pointer used by the CD pipeline to resolve the newest artefact by digest.
                  aws s3 cp build/artefact-record.json "s3://$ARTEFACT_BUCKET/fineract/${{ github.ref_name }}/artefact-record.json"

            - name: Start deployment pipeline
              if: github.ref_name == 'develop'
              run: |
                  aws codepipeline start-pipeline-execution --name "$CODEPIPELINE_NAME"
