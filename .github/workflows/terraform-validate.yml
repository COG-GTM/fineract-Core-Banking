name: Terraform - landing zone validation

on:
  push:
    paths:
      - 'infrastructure/terraform/**'
      - '.github/workflows/terraform-validate.yml'
  pull_request:
    paths:
      - 'infrastructure/terraform/**'
      - '.github/workflows/terraform-validate.yml'

permissions:
  contents: read

env:
  TERRAFORM_VERSION: 1.9.8
  TFLINT_VERSION: v0.53.0

jobs:
  fmt:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt -check
        working-directory: infrastructure/terraform
        run: terraform fmt -check -recursive -diff

  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        directory:
          - infrastructure/terraform/modules/network
          - infrastructure/terraform/modules/security
          - infrastructure/terraform/modules/dns
          - infrastructure/terraform/modules/edge
          - infrastructure/terraform/envs/dev
          - infrastructure/terraform/envs/prod
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: terraform init -backend=false
        working-directory: ${{ matrix.directory }}
        run: terraform init -backend=false -input=false -no-color

      - name: terraform validate
        working-directory: ${{ matrix.directory }}
        run: terraform validate -no-color

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@90f302c255ef959cbfb4bd10581afecdb7ece3e6 # v4.1.1
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}

      - name: tflint
        working-directory: ${{ matrix.directory }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tflint --init --config "$GITHUB_WORKSPACE/infrastructure/terraform/.tflint.hcl"
          tflint --config "$GITHUB_WORKSPACE/infrastructure/terraform/.tflint.hcl" --no-color
