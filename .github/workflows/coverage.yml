name: Fineract Code Coverage

on: [push, pull_request]

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 21
        uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e # v5
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Cache Gradle dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Setup Gradle and Validate Wrapper
        uses: gradle/actions/setup-gradle@f29f5a9d7b09a7c6b29859002d29d24e1674c884 # v5.0.1
        with:
          validate-wrappers: true

      - name: Run tests and generate coverage
        run: |
          ./gradlew --no-daemon --console=plain test jacocoAggregatedReport jacocoAggregatedCoverageVerification jacocoTestCoverageVerification \
            -x :integration-tests:test \
            -x :twofactor-tests:test \
            -x :oauth2-tests:test \
            -x :fineract-e2e-tests-core:test \
            -x :fineract-e2e-tests-runner:test \
            -x checkstyleMain \
            -x checkstyleTest \
            -x spotlessCheck \
            -x spotbugsMain \
            -x spotbugsTest \
            -x javadoc \
            -x modernizer

      - name: Upload aggregate coverage
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v4
        with:
          name: coverage-aggregate
          path: build/reports/jacoco/aggregate/
          retention-days: 5

      - name: Upload module coverage
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v4
        with:
          name: coverage-modules
          path: '**/build/reports/jacoco/'
          retention-days: 5
