# AWS Distro for OpenTelemetry (ADOT) collector sidecar for Fineract ECS tasks.
# Fineract sends spans over OTLP/HTTP to localhost:4318 (FINERACT_MANAGEMENT_OTLP_TRACING_ENDPOINT);
# the collector forwards them to AWS X-Ray. OTLP metrics (FINERACT_MANAGEMENT_OLTP_ENABLED=true,
# FINERACT_MANAGEMENT_OLTP_METRICS_EXPORT_URL=http://localhost:4318/v1/metrics) go to CloudWatch as EMF.
# Run with: --config=/etc/otel/collector-config.yaml and AWS_REGION set; the task role needs
# xray:PutTraceSegments, xray:PutTelemetryRecords and logs:PutLogEvents/CreateLogStream/CreateLogGroup.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
  resourcedetection:
    detectors: [env, ecs]
    timeout: 2s
    override: false

exporters:
  awsxray:
    indexed_attributes: [http.route, http.method, status]
  awsemf:
    namespace: ${env:FINERACT_OTLP_METRICS_NAMESPACE:-fineract-otlp}
    log_group_name: ${env:FINERACT_OTLP_METRICS_LOG_GROUP:-/fineract/otlp-metrics}

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [resourcedetection, batch]
      exporters: [awsxray]
    metrics:
      receivers: [otlp]
      processors: [resourcedetection, batch]
      exporters: [awsemf]
