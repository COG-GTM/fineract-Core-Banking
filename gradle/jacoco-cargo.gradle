ext.jacocoCargoJvmArg = "-javaagent:${buildDir}/jacoco-agent/jacocoagent.jar=destfile=${buildDir}/jacoco/cargo.exec,append=true,output=file,includes=org.apache.fineract.*"

plugins.withId('jacoco') {
    tasks.register('extractJacocoAgent', Copy) {
        from {
            configurations.jacocoAgent.collect { zipTree(it) }
        }
        include 'jacocoagent.jar'
        into layout.buildDirectory.dir('jacoco-agent')
    }

    tasks.named('cargoStartLocal') {
        dependsOn extractJacocoAgent
    }
    tasks.named('cargoRunLocal') {
        dependsOn extractJacocoAgent
    }
}
