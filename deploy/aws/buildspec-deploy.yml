#
# Deploy stage of the Fineract CD pipeline. The pipeline never resolves a tag:
# it reads the artefact record published by the build and applies the manifest
# with the image pinned to that record's digest.

version: 0.2

env:
    variables:
        MANIFEST: kubernetes/fineract-server-deployment.yml
    exported-variables:
        - FINERACT_IMAGE

phases:
    install:
        commands:
            - curl -sSLo /usr/local/bin/kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
            - chmod +x /usr/local/bin/kubectl
    pre_build:
        commands:
            - aws s3 cp "s3://${ARTEFACT_BUCKET}/fineract/${TARGET_REF}/artefact-record.json" artefact-record.json
            - FINERACT_IMAGE="$(jq -r '.image' artefact-record.json)"
            - echo "Deploying $FINERACT_IMAGE"
            # Fail the deployment if the digest referenced by the artefact record
            # is no longer present in ECR.
            - aws ecr describe-images --repository-name "${ECR_REPOSITORY}" --image-ids imageDigest="$(jq -r '.digest' artefact-record.json)" > /dev/null
            - ./deploy/scripts/render-image-digest.sh artefact-record.json "$MANIFEST" rendered-deployment.yml
    build:
        commands:
            - aws eks update-kubeconfig --name "${EKS_CLUSTER_NAME}" --region "${AWS_REGION}"
            - kubectl apply -f rendered-deployment.yml
            - kubectl rollout status deployment/fineract-server --timeout=10m

artifacts:
    files:
        - rendered-deployment.yml
        - artefact-record.json
